    <!--
      КОНТРАКТ НАПРАВЛЕНИЯ

      THESIS: Ты можешь бесконечно оптимизировать Директ, но если проблема
      находится дальше по связке, нужного рычага внутри рекламного кабинета
      просто нет. Воронка не учит новой настройке — она показывает, что растить
      доход можно вверх по связке, а не вбок по числу кабинетов.

      OWN-WORLD: Две сущности и одна граница между ними.
      (1) РАЙОНЫ ТРАФИКА — способы привести человека: Direct, VK, Avito, TG Ads.
      Копятся вбок, упираются в потолок.
      (2) CONVERSION DISTRICT — то, что решает, станет ли приведённый человек
      деньгами: аудитория, оффер, посадка, лид, квал, продажа. Открывается по
      участкам, потолка не имеет.
      (3) ЛИД, КВАЛ и ПРОДАЖА не открываются НИКОГДА. Это честный тезис
      продукта: ты контролируешь значительно большую часть пути до денег, но не
      путь целиком.
      Запрещено: кристаллы, показатели чистоты, выбор персоны, неон на
      неоткрытых участках, второй индикатор прогресса рядом со связкой.

      STORY: Клиент написал «посмотри, что там с Директом». Ты уже проверил всё,
      что можно проверить внутри кабинета. Камера отъезжает, поднимается над
      районами — и оказывается, что решается всё выше. Три главы забирают тебе
      аудиторию, оффер и посадку; проверка открывает лабораторию; в финале
      связка включается, и ты тыкаешь собранный сайт.

      FIRST VIEWPORT: Чёрный экран. Поверх города прилетает сообщение клиента:
      «Лиды опять какие-то холодные. ОП говорит, звонить некому. Посмотри, что
      там с Директом». Никаких кнопок — сцена начинается сама.

      FORM: Восемь шагов вместо тридцати одного. Экран меняется только когда
      меняется РЕЖИМ: смотрел сцену → смотрит видео → отвечает на вопросы. Всё

      эпизодах: въезд в город, подъём в Conversion District, открытие дверей
      лаборатории, включение собранной связки.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the

    -->
